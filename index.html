<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F4D9C8">
  <title>Mochi's Room 🌿 - Koy & Metz</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(180deg, #F4D9C8 0%, #E8C9B8 50%, #D9B8A8 100%);
      min-height: 100vh; min-height: 100dvh;
      color: #4A3F3A;
      padding: 10px;
      display: flex; justify-content: center; align-items: flex-start;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    #app { width: 100%; max-width: 480px; position: relative; z-index: 1; }

    /* ============================================ */
    /* LOGIN SCREEN - pixel style                    */
    /* ============================================ */
    .pin-screen {
      background: #FDF6EE;
      border: 4px solid #8B6F5E;
      border-radius: 8px;
      padding: 28px 22px 24px;
      text-align: center;
      box-shadow: 0 6px 0 #8B6F5E;
    }
    .pin-screen h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.1rem;
      color: #8B6F5E;
      margin-bottom: 8px;
      letter-spacing: 0;
      line-height: 1.4;
    }
    .pin-screen .subtitle {
      font-size: 0.85rem;
      color: #A89080;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .big-emoji {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 12px;
      animation: bob 2.4s ease-in-out infinite;
      display: inline-block;
      image-rendering: pixelated;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .pin-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.3rem;
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      text-align: center;
      letter-spacing: 8px;
      border: 3px solid #C9B0A0;
      background: #FFFDF9;
      color: #4A3F3A;
      outline: none;
      margin-bottom: 12px;
    }
    .pin-input:focus {
      border-color: #8B6F5E;
      background: #FFFFFF;
    }
    .pin-input::placeholder {
      letter-spacing: 2px;
      font-size: 0.75rem;
      color: #C9B0A0;
    }

    .role-pick { display: flex; gap: 8px; margin-bottom: 12px; }
    .role-btn {
      flex: 1;
      padding: 13px 8px;
      border: 3px solid #C9B0A0;
      background: #FFFDF9;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: #8B6F5E;
      cursor: pointer;
      transition: all 0.15s;
    }
    .role-btn.selected {
      background: #F4D9C8;
      border-color: #8B6F5E;
      color: #4A3F3A;
      box-shadow: 0 3px 0 #8B6F5E;
    }
    .role-btn:active { transform: translateY(2px); box-shadow: none; }

    .btn {
      background: #8B6F5E;
      color: white;
      border: none;
      padding: 15px 26px;
      font-size: 0.95rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 0 #6B4F3E;
      transition: all 0.1s;
      width: 100%;
      min-height: 52px;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #6B4F3E;
    }

    /* ============================================ */
    /* GAME SCREEN                                   */
    /* ============================================ */
    #gameScreen { display: none; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FDF6EE;
      border: 3px solid #C9B0A0;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }
    .streak-display, .days-display {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      color: #8B6F5E;
      padding: 4px 8px;
      background: #F4E9DE;
      border-radius: 4px;
    }
    .streak-display.hot {
      background: #F4D9C8;
      animation: streakPulse 1.5s infinite;
    }
    @keyframes streakPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 217, 200, 0.8); }
      50% { box-shadow: 0 0 0 6px rgba(244, 217, 200, 0); }
    }
    .who-am-i {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: #4A3F3A;
    }

    /* ============================================ */
    /* ROOM SCENE                                    */
    /* ============================================ */
    .room {
      background: #FDF6EE;
      border: 4px solid #8B6F5E;
      border-radius: 8px;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 0 #8B6F5E;
    }

    /* Wall */
    .room-wall {
      height: 180px;
      background:
        linear-gradient(180deg, #F4D9C8 0%, #F4D9C8 60%, #E8C9B8 60%, #E8C9B8 100%);
      position: relative;
      overflow: hidden;
    }
    /* Pixel wallpaper pattern */
    .room-wall::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20px 20px, #E8BBA8 2px, transparent 2px),
        radial-gradient(circle at 60px 60px, #E8BBA8 2px, transparent 2px);
      background-size: 40px 40px;
      opacity: 0.4;
    }
    /* Night mode for room */
    .room.night .room-wall {
      background: linear-gradient(180deg, #2A2438 0%, #2A2438 60%, #3A3448 60%, #3A3448 100%);
    }
    .room.night .room-wall::before {
      background-image:
        radial-gradient(circle at 20px 20px, #4A4458 2px, transparent 2px),
        radial-gradient(circle at 60px 60px, #4A4458 2px, transparent 2px);
    }

    /* Window */
    .room-window {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #B8D8E8;
      border: 4px solid #8B6F5E;
      border-radius: 4px;
      box-shadow: 0 3px 0 #6B4F3E;
      z-index: 5;
    }
    .room-window::before {
      content: '';
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 3px;
      background: #8B6F5E;
      transform: translateY(-50%);
    }
    .room-window::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 3px;
      background: #8B6F5E;
      transform: translateX(-50%);
    }
    .room.night .room-window { background: #1A1428; }

    /* Floor */
    .room-floor {
      height: 60px;
      background:
        repeating-linear-gradient(90deg, #D9B8A8 0px, #D9B8A8 20px, #C9A898 20px, #C9A898 40px);
      border-top: 3px solid #8B6F5E;
      position: relative;
    }
    .room.night .room-floor {
      background:
        repeating-linear-gradient(90deg, #3A3448 0px, #3A3448 20px, #2A2438 20px, #2A2438 40px);
    }

    /* ============================================ */
    /* THE PET                                       */
    /* ============================================ */
    .pet-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      height: 140px;
      z-index: 10;
    }

    .pet {
      position: absolute;
      font-size: 3.5rem;
      line-height: 1;
      transition: left 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 0 rgba(139, 111, 94, 0.4));
      z-index: 20;
      left: 50%;
      transform: translateX(-50%);
    }
    .pet.walking {
      animation: walk 0.6s steps(2) infinite;
    }
    @keyframes walk {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }
    .pet.idle {
      animation: idle 3s ease-in-out infinite;
    }
    @keyframes idle {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }
    .pet.happy {
      animation: happyJump 0.5s ease-in-out infinite;
    }
    @keyframes happyJump {
      0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
      50% { transform: translateX(-50%) translateY(-12px) scale(1.05); }
    }
    .pet.sleeping {
      animation: sleepBreath 3s ease-in-out infinite;
      opacity: 0.9;
    }
    @keyframes sleepBreath {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.04); }
    }
    .pet.sad {
      animation: sadShake 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 0 rgba(139, 111, 94, 0.4)) grayscale(0.4);
    }
    @keyframes sadShake {
      0%, 100% { transform: translateX(-50%) rotate(0deg); }
      25% { transform: translateX(-50%) rotate(-3deg); }
      75% { transform: translateX(-50%) rotate(3deg); }
    }

    /* Scene props */
    .scene-prop {
      position: absolute;
      font-size: 1.8rem;
      z-index: 15;
      image-rendering: pixelated;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .prop-bowl {
      left: 20%;
      bottom: 15px;
    }
    .prop-bed {
      right: 15%;
      bottom: 10px;
      font-size: 2.4rem;
    }
    .prop-tub {
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      font-size: 2.4rem;
    }
    .prop-ball {
      right: 25%;
      bottom: 30px;
      animation: ballBounce 1s ease-in-out infinite;
    }
    @keyframes ballBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* Poop */
    .poop {
      position: absolute;
      font-size: 1.4rem;
      bottom: 20px;
      z-index: 12;
      animation: poopIn 0.3s ease-out;
    }
    @keyframes poopIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* Action text bubbles */
    .speech-bubble {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border: 3px solid #8B6F5E;
      padding: 6px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: #4A3F3A;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 30;
      animation: bubbleIn 0.3s ease-out;
    }
    @keyframes bubbleIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(5px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #8B6F5E;
    }

    /* Floating hearts */
    .heart-float {
      position: absolute;
      font-size: 1rem;
      z-index: 25;
      pointer-events: none;
      animation: heartFloat 1.5s ease-out forwards;
    }
    @keyframes heartFloat {
      0% { opacity: 1; transform: translateY(0) scale(0.5); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
    }

    /* Zzz sleep */
    .zzz {
      position: absolute;
      font-family: 'Press Start 2P', monospace;
      color: #8B6F5E;
      font-size: 0.7rem;
      z-index: 30;
      pointer-events: none;
      animation: zzzFloat 2.5s ease-out infinite;
    }
    @keyframes zzzFloat {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(25px, -50px) scale(1.1); }
    }

    /* Bubbles bath */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #FFFFFF, #B8D8E8);
      border: 2px solid #8B6F5E;
      z-index: 25;
      pointer-events: none;
      animation: bubbleRise 2s ease-out infinite;
    }
    @keyframes bubbleRise {
      0% { opacity: 0; transform: translateY(0) scale(0.3); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-70px) scale(1); }
    }

    /* ============================================ */
    /* STATS - pixel style                           */
    /* ============================================ */
    .pet-info {
      padding: 10px 12px 12px;
      background: #FDF6EE;
    }
    .pet-name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .pet-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      color: #4A3F3A;
    }
    .pet-stage-badge {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: #A89080;
      padding: 3px 8px;
      background: #F4E9DE;
      border: 2px solid #C9B0A0;
      border-radius: 4px;
    }
    .pet-stage-badge.level-up {
      background: #F4D9C8;
      color: #8B6F5E;
      animation: levelUpPulse 1s ease;
    }
    @keyframes levelUpPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .stat {
      background: #F4E9DE;
      border: 2px solid #C9B0A0;
      padding: 6px 8px;
      border-radius: 4px;
    }
    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: #8B6F5E;
      margin-bottom: 4px;
    }
    .stat-bar {
      height: 6px;
      background: #E8D9C8;
      border: 2px solid #8B6F5E;
      border-radius: 3px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      transition: width 0.5s;
    }
    .stat-bar-fill.good { background: #8FB87D; }
    .stat-bar-fill.medium { background: #D4B472; }
    .stat-bar-fill.low { background: #D18F73; }

    /* ============================================ */
    /* ACTIONS - pixel buttons                       */
    /* ============================================ */
    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 0 12px 12px;
    }
    .action-btn {
      background: #FFFDF9;
      border: 3px solid #C9B0A0;
      border-radius: 4px;
      padding: 10px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      box-shadow: 0 3px 0 #C9B0A0;
      transition: all 0.1s;
      min-height: 70px;
      justify-content: center;
    }
    .action-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-btn .emoji {
      font-size: 1.5rem;
      line-height: 1;
      image-rendering: pixelated;
    }
    .action-btn .label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      color: #8B6F5E;
    }

    /* ============================================ */
    /* DIARY                                         */
    /* ============================================ */
    .diary {
      background: #FDF6EE;
      border: 3px solid #C9B0A0;
      border-radius: 6px;
      padding: 10px;
      margin: 0 12px 12px;
    }
    .diary-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: #8B6F5E;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .diary-scroll {
      max-height: 100px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .diary-scroll::-webkit-scrollbar { width: 4px; }
    .diary-scroll::-webkit-scrollbar-thumb { background: #C9B0A0; border-radius: 2px; }
    .diary-entry {
      font-size: 0.72rem;
      padding: 5px 8px;
      margin-bottom: 3px;
      background: #F4E9DE;
      border-left: 3px solid #C9B0A0;
      border-radius: 3px;
      color: #6B5F4D;
      animation: diarySlide 0.3s;
    }
    @keyframes diarySlide {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .diary-entry.by-koy { border-left-color: #8B6F5E; }
    .diary-entry.by-metz { border-left-color: #C9A0A0; }
    .diary-entry .time {
      font-size: 0.6rem;
      color: #A89080;
      margin-right: 4px;
      font-family: 'Press Start 2P', monospace;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #8B6F5E;
      color: white;
      padding: 10px 18px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      border-radius: 4px;
      z-index: 1000;
      transition: transform 0.3s;
      max-width: 90vw;
      text-align: center;
      line-height: 1.5;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Level up overlay */
    .levelup-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1000;
      animation: levelupFade 2s ease-out forwards;
    }
    @keyframes levelupFade {
      0% { opacity: 0; transform: scale(0.8); }
      20% { opacity: 1; transform: scale(1.05); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }
    .levelup-badge {
      background: #8B6F5E;
      color: white;
      padding: 20px 28px;
      border: 4px solid #FFFDF9;
      border-radius: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      text-align: center;
      line-height: 1.6;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 0.65rem;
      color: #A89080;
      margin: 8px 0 20px;
    }

    @media (max-width: 380px) {
      .pet { font-size: 3rem; }
      .room-wall { height: 160px; }
      .action-btn { min-height: 64px; }
      .action-btn .emoji { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div id="app">

    <!-- ==================== LOGIN ==================== -->
    <div class="pin-screen" id="pinScreen">
      <div class="big-emoji" id="welcomeEmoji">🥚</div>
      <h1>MOCHI'S ROOM</h1>
      <p class="subtitle">A tiny life we care for together 🌿</p>

      <div class="role-pick">
        <button class="role-btn" data-role="koy">🌿 Koy</button>
        <button class="role-btn" data-role="metz">🌸 Metz</button>
      </div>

      <input type="tel" class="pin-input" id="pinInput" placeholder="PIN" maxlength="4" inputmode="numeric" pattern="[0-9]*">

      <button class="btn" id="loginBtn">ENTER ROOM</button>

      <p style="font-size: 0.7rem; color: #C9B0A0; margin-top: 14px; line-height: 1.5;">
        Pick who you are and create a 4-digit PIN.<br>
        You both use this same page.
      </p>
    </div>

    <!-- ==================== GAME ==================== -->
    <div id="gameScreen">

      <!-- Top bar -->
      <div class="top-bar">
        <div class="streak-display" id="streakBox">
          <span>🔥</span><span id="streakCount">0</span>
        </div>
        <div class="who-am-i" id="whoAmI">🌿 KOY</div>
        <div class="days-display">
          <span>🌱</span><span id="daysCount">0</span>
        </div>
      </div>

      <!-- THE ROOM -->
      <div class="room" id="room">
        <div class="room-wall">
          <div class="room-window"></div>

          <!-- Pet area inside room -->
          <div class="pet-area" id="petArea">
            <div class="pet idle" id="pet" style="left: 50%;">🥚</div>
          </div>
        </div>
        <div class="room-floor"></div>

        <!-- Pet info below room -->
        <div class="pet-info">
          <div class="pet-name-row">
            <div class="pet-name" id="petName">Mochi</div>
            <div class="pet-stage-badge" id="petStageBadge">EGG</div>
          </div>

          <div class="stats">
            <div class="stat">
              <div class="stat-header"><span>🍚 FOOD</span><span id="hungerVal">100</span></div>
              <div class="stat-bar"><div class="stat-bar-fill good" id="hungerBar" style="width:100%"></div></div>
            </div>
            <div class="stat">
              <div class="stat-header"><span>☀️ JOY</span><span id="happyVal">100</span></div>
              <div class="stat-bar"><div class="stat-bar-fill good" id="happyBar" style="width:100%"></div></div>
            </div>
            <div class="stat">
              <div class="stat-header"><span>🌙 REST</span><span id="energyVal">100</span></div>
              <div class="stat-bar"><div class="stat-bar-fill good" id="energyBar" style="width:100%"></div></div>
            </div>
            <div class="stat">
              <div class="stat-header"><span>💧 CLEAN</span><span id="cleanVal">100</span></div>
              <div class="stat-bar"><div class="stat-bar-fill good" id="cleanBar" style="width:100%"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="action-btn" data-action="feed"><span class="emoji">🍚</span><span class="label">FEED</span></button>
        <button class="action-btn" data-action="play"><span class="emoji">🎈</span><span class="label">PLAY</span></button>
        <button class="action-btn" data-action="sleep"><span class="emoji">🌙</span><span class="label">SLEEP</span></button>
        <button class="action-btn" data-action="bath"><span class="emoji">💧</span><span class="label">BATH</span></button>
        <button class="action-btn" data-action="pet"><span class="emoji">🤲</span><span class="label">PET</span></button>
        <button class="action-btn" data-action="clean"><span class="emoji">🧹</span><span class="label">CLEAN</span></button>
      </div>

      <!-- Diary -->
      <div class="diary">
        <div class="diary-title">
          <span>📖 MOCHI'S DIARY</span>
          <span id="diaryCount">0</span>
        </div>
        <div class="diary-scroll" id="diaryScroll">
          <div style="text-align:center; color:#C9B0A0; font-size:0.7rem; padding:8px;">
            Nothing yet! 🌿
          </div>
        </div>
      </div>

      <button class="btn" id="logoutBtn" style="background:#B8A898; box-shadow:0 4px 0 #8B6F5E; margin:0 12px 8px; font-size:0.85rem; padding:12px;">SWITCH USER</button>
      <p class="footer">Made with care for Mochi 🌿</p>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpxlMZiAcJwI2RuNTJ14jSaHhV-nBcW7A",
      authDomain: "mochigotchi.firebaseapp.com",
      databaseURL: "https://mochigotchi-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mochigotchi",
      storageBucket: "mochigotchi.firebasestorage.app",
      messagingSenderId: "441429859962",
      appId: "1:441429859962:web:d0a5e1af080bb394a725c3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // CONSTANTS
    // ============================================================
    const DECAY_PER_MINUTE = 0.12;
    const OFFLINE_CAP_HOURS = 6;
    const MAX_DIARY = 40;
    const DAILY_GOAL = 5;
    const ANIMATION_DURATION = 3000;
    const NIGHT_START = 22;
    const NIGHT_END = 7;

    const STAGES = [
      { level: 1,  name: 'EGG',      emoji: '🥚' },
      { level: 3,  name: 'HATCHLING',emoji: '🐣' },
      { level: 6,  name: 'SPROUT',   emoji: '🐥' },
      { level: 12, name: 'SAPLING',  emoji: '🐤' },
      { level: 20, name: 'BLOOM',    emoji: '🦜' },
      { level: 35, name: 'GUARDIAN', emoji: '🦚' },
      { level: 50, name: 'MYSTIC',   emoji: '🦅' },
      { level: 75, name: 'ETERNAL',  emoji: '🌿' }
    ];

    const ACTIONS = {
      feed:  { stat: 'hunger', amount: 25, xp: 2, verb: 'fed',             emoji: '🍚' },
      play:  { stat: 'happy',  amount: 22, xp: 3, verb: 'played with',     emoji: '🎈', cost: { energy: 8 } },
      sleep: { stat: 'energy', amount: 30, xp: 2, verb: 'tucked in',       emoji: '🌙' },
      bath:  { stat: 'clean',  amount: 30, xp: 2, verb: 'bathed',          emoji: '💧' },
      pet:   { stat: 'happy',  amount: 8,  xp: 1, verb: 'petted',          emoji: '🤲' },
      clean: { stat: 'clean',  amount: 15, xp: 2, verb: 'cleaned up after', emoji: '🧹' }
    };

    const MOODS = {
      happy:  ['feeling wonderful 🌸', 'bouncing with joy ✨', 'so content 🌿', 'purring softly 💫'],
      ok:     ['doing just fine 🌱', 'quietly content 🍃', 'cozy and calm 🕊️'],
      low:    ['feeling a little tired 💤', 'missing you a bit 🌧️', 'hoping you come back soon 🌙'],
      sad:    ['really needs you 💧', 'feeling lonely 🌫️', 'please come back soon 🌧️']
    };

    // ============================================================
    // STATE
    // ============================================================
    let me = 'koy';
    let gameData = null;
    let myLastSeen = 0;
    let hasShownWelcome = false;
    let lastActionAt = 0;
    let lastLevel = 1;
    let isAnimating = false;
    let animationTimeout = null;
    let poops = [];

    const $ = (id) => document.getElementById(id);

    // ============================================================
    // TOAST
    // ============================================================
    let toastT;
    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(() => t.classList.remove('show'), 2400);
    }

    // ============================================================
    // LOGIN
    // ============================================================
    let selectedRole = null;
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedRole = btn.dataset.role;
        $('welcomeEmoji').textContent = selectedRole === 'koy' ? '🌿' : '🌸';
      });
    });

    const savedRole = localStorage.getItem('mochi_role');
    const savedPin = localStorage.getItem('mochi_pin');
    if (savedRole && savedPin) {
      selectedRole = savedRole;
      $('pinInput').value = savedPin;
      document.querySelectorAll('.role-btn').forEach(b => {
        if (b.dataset.role === savedRole) b.classList.add('selected');
      });
      $('welcomeEmoji').textContent = savedRole === 'koy' ? '🌿' : '🌸';
    }

    $('loginBtn').addEventListener('click', () => {
      const pin = $('pinInput').value.trim();
      if (!selectedRole) return showToast('Pick who you are first 🌿');
      if (!/^\d{4}$/.test(pin)) return showToast('PIN must be 4 digits');

      me = selectedRole;
      localStorage.setItem('mochi_role', me);
      localStorage.setItem('mochi_pin', pin);
      myLastSeen = parseInt(localStorage.getItem('mochi_last_' + me)) || 0;

      $('pinScreen').style.display = 'none';
      $('gameScreen').style.display = 'block';
      $('whoAmI').textContent = me === 'koy' ? '🌿 KOY' : '🌸 METZ';

      listenToGame();
    });

    // ============================================================
    // FIREBASE
    // ============================================================
    function listenToGame() {
      const ref = db.ref('tamagotchi');
      ref.once('value').then(snap => {
        if (!snap.exists()) {
          const now = Date.now();
          ref.set({
            name: 'Mochi',
            createdAt: now,
            lastUpdate: now,
            hunger: 100, happy: 100, energy: 100, clean: 100,
            xp: 0, level: 1,
            streak: 0, lastStreakDate: '',
            poops: 0,
            koyLastSeen: now, metzLastSeen: 0,
            todayActions: { koy: 0, metz: 0 },
            todayDate: '',
            diary: {}
          }).then(() => ref.on('value', handleUpdate));
        } else {
          ref.on('value', handleUpdate);
        }
      });
    }

    function handleUpdate(snap) {
      const data = snap.val();
      if (!data) return;

      const now = Date.now();
      const lastUpdate = data.lastUpdate || now;
      const minutesOffline = Math.min((now - lastUpdate) / 60000, OFFLINE_CAP_HOURS * 60);
      const decay = minutesOffline * DECAY_PER_MINUTE;

      const prev = { ...data };

      data.hunger = Math.max(0, (data.hunger ?? 100) - decay);
      data.happy  = Math.max(0, (data.happy  ?? 100) - decay);
      data.energy = Math.max(0, (data.energy ?? 100) - decay);
      data.clean  = Math.max(0, (data.clean  ?? 100) - decay);

      const today = new Date().toISOString().slice(0, 10);
      if (data.todayDate !== today) {
        data.todayActions = { koy: 0, metz: 0 };
        data.todayDate = today;
      }

      gameData = data;
      updateLevel();

      if (minutesOffline > 0.5) {
        gameData.lastUpdate = now;
        db.ref('tamagotchi').update({
          hunger: data.hunger, happy: data.happy,
          energy: data.energy, clean: data.clean,
          lastUpdate: now,
          todayActions: data.todayActions,
          todayDate: data.todayDate
        });
      }

      if (!isAnimating) renderPet(prev);
      renderDiary();
      updateStreakAndDays();
      checkStreak();
      updateDayNight();

      if (!hasShownWelcome && myLastSeen > 0 && now - myLastSeen > 5 * 60 * 1000) {
        showWelcomeBack(prev, data, myLastSeen);
      }
      hasShownWelcome = true;

      myLastSeen = now;
      localStorage.setItem('mochi_last_' + me, now);
      db.ref('tamagotchi/' + (me === 'koy' ? 'koyLastSeen' : 'metzLastSeen')).set(now);
    }

    // ============================================================
    // LEVELS
    // ============================================================
    function xpForLevel(level) {
      return Math.floor(60 + (level - 1) * 35 + Math.pow(level - 1, 1.7) * 12);
    }
    function updateLevel() {
      let lvl = 1, xp = gameData.xp || 0;
      while (lvl < 100 && xp >= xpForLevel(lvl)) { xp -= xpForLevel(lvl); lvl++; }
      gameData.level = lvl;
      if (lvl > lastLevel && lastLevel !== 0) {
        setTimeout(() => showLevelUp(lvl), 400);
      }
      lastLevel = lvl;
    }
    function currentStage() {
      let s = STAGES[0];
      for (const st of STAGES) if (gameData.level >= st.level) s = st;
      return s;
    }

    // ============================================================
    // DAY / NIGHT
    // ============================================================
    function isNightTime() {
      const h = new Date().getHours();
      return h >= NIGHT_START || h < NIGHT_END;
    }
    function updateDayNight() {
      const room = $('room');
      if (isNightTime()) room.classList.add('night');
      else room.classList.remove('night');
    }

    // ============================================================
    // RENDER PET
    // ============================================================
    function renderPet(prev = {}) {
      const stage = currentStage();
      const pet = $('pet');
      pet.textContent = stage.emoji;
      $('petName').textContent = gameData.name || 'Mochi';
      $('petStageBadge').textContent = stage.name;

      const avg = (gameData.hunger + gameData.happy + gameData.energy + gameData.clean) / 4;
      let moodClass = 'idle';
      if (avg < 25) moodClass = 'sad';
      else if (avg < 50) moodClass = 'sad';
      else if (avg > 75) moodClass = 'happy';

      // Night = sleeping pose
      if (isNightTime() && !isAnimating) moodClass = 'sleeping';

      pet.className = 'pet ' + moodClass;

      // Render poops
      renderPoops();

      setStat('hunger', gameData.hunger, prev.hunger);
      setStat('happy', gameData.happy, prev.happy);
      setStat('energy', gameData.energy, prev.energy);
      setStat('clean', gameData.clean, prev.clean);
    }

    function renderPoops() {
      const area = $('petArea');
      // Remove existing
      area.querySelectorAll('.poop').forEach(p => p.remove());
      const count = gameData.poops || 0;
      for (let i = 0; i < Math.min(count, 3); i++) {
        const p = document.createElement('div');
        p.className = 'poop';
        p.textContent = '💩';
        p.style.left = (20 + i * 20) + '%';
        area.appendChild(p);
      }
    }

    function setStat(name, val, prev) {
      val = Math.round(val);
      $(name + 'Val').textContent = val;
      const bar = $(name + 'Bar');
      bar.style.width = val + '%';
      bar.className = 'stat-bar-fill ' + (val > 60 ? 'good' : val > 30 ? 'medium' : 'low');
    }

    function renderDiary() {
      const diary = gameData.diary || {};
      const entries = Object.values(diary).sort((a, b) => b.time - a.time).slice(0, MAX_DIARY);
      const scroll = $('diaryScroll');
      scroll.innerHTML = '';
      if (entries.length === 0) {
        scroll.innerHTML = '<div style="text-align:center; color:#C9B0A0; font-size:0.7rem; padding:8px;">Nothing yet! 🌿</div>';
      } else {
        entries.forEach(e => {
          const div = document.createElement('div');
          div.className = 'diary-entry by-' + e.by;
          const t = new Date(e.time);
          const timeStr = t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          const who = e.by === 'koy' ? '🌿 Koy' : '🌸 Metz';
          div.innerHTML = `<span class="time">${timeStr}</span>${who} ${e.text}`;
          scroll.appendChild(div);
        });
      }
      $('diaryCount').textContent = entries.length;
    }

    function updateStreakAndDays() {
      const days = Math.floor((Date.now() - gameData.createdAt) / (1000 * 60 * 60 * 24)) + 1;
      $('daysCount').textContent = days;
      $('streakCount').textContent = gameData.streak || 0;
      const box = $('streakBox');
      if ((gameData.streak || 0) >= 3) box.classList.add('hot');
      else box.classList.remove('hot');
    }

    function checkStreak() {
      const today = new Date().toISOString().slice(0, 10);
      const last = gameData.lastStreakDate || '';
      if (last === today) return;
      const yest = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const newStreak = (last === yest) ? (gameData.streak || 0) + 1 : 1;
      gameData.streak = newStreak;
      gameData.lastStreakDate = today;
      db.ref('tamagotchi').update({ streak: newStreak, lastStreakDate: today });
    }

    // ============================================================
    // ANIMATION ENGINE
    // ============================================================
    function movePetTo(percent, duration) {
      return new Promise(resolve => {
        const pet = $('pet');
        pet.style.transition = `left ${duration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
        pet.style.left = percent + '%';
        setTimeout(resolve, duration);
      });
    }

    function showBubble(text, emoji) {
      const area = $('petArea');
      const pet = $('pet');
      const bubble = document.createElement('div');
      bubble.className = 'speech-bubble';
      bubble.textContent = emoji + ' ' + text;
      bubble.style.top = '-40px';
      bubble.style.left = pet.style.left || '50%';
      bubble.style.transform = 'translateX(-50%)';
      area.appendChild(bubble);
      setTimeout(() => bubble.remove(), 2200);
    }

    function floatHearts(count = 5) {
      const area = $('petArea');
      const pet = $('pet');
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const h = document.createElement('div');
          h.className = 'heart-float';
          h.textContent = ['💚', '💖', '✨', '💫', '🌟'][i % 5];
          h.style.left = (35 + Math.random() * 30) + '%';
          h.style.bottom = '80px';
          h.style.animationDelay = (i * 0.15) + 's';
          area.appendChild(h);
          setTimeout(() => h.remove(), 1800);
        }, i * 120);
      }
    }

    function addProp(emoji, className, style) {
      const area = $('petArea');
      const prop = document.createElement('div');
      prop.className = 'scene-prop ' + className;
      prop.textContent = emoji;
      Object.assign(prop.style, style);
      area.appendChild(prop);
      return prop;
    }

    function playActionAnimation(name) {
      const pet = $('pet');
      return new Promise(async (resolve) => {
        switch(name) {
          case 'feed': {
            // Create bowl
            const bowl = addProp('🍚', 'prop-bowl', { left: '20%', bottom: '15px' });
            // Walk to bowl
            pet.className = 'pet walking';
            await movePetTo(28, 1200);
            // Eat
            pet.className = 'pet happy';
            for (let i = 0; i < 3; i++) {
              setTimeout(() => floatHearts(1), i * 400);
            }
            showBubble('nom nom!', '🍚');
            await new Promise(r => setTimeout(r, 1500));
            // Walk back
            pet.className = 'pet walking';
            await movePetTo(50, 1200);
            bowl.remove();
            pet.className = 'pet idle';
            resolve();
            break;
          }
          case 'play': {
            const ball = addProp('🎈', 'prop-ball', { right: '25%' });
            pet.className = 'pet happy';
            showBubble('wheee!', '🎈');
            floatHearts(6);
            await new Promise(r => setTimeout(r, 2000));
            ball.remove();
            pet.className = 'pet idle';
            resolve();
            break;
          }
          case 'sleep': {
            const bed = addProp('🛏️', 'prop-bed', { right: '15%' });
            pet.className = 'pet walking';
            await movePetTo(70, 1200);
            pet.className = 'pet sleeping';
            // Zzz
            for (let i = 0; i < 4; i++) {
              setTimeout(() => {
                const z = document.createElement('div');
                z.className = 'zzz';
                z.textContent = 'Z';
                z.style.left = '65%';
                z.style.bottom = '90px';
                z.style.fontSize = (0.6 + i * 0.1) + 'rem';
                $('petArea').appendChild(z);
                setTimeout(() => z.remove(), 2500);
              }, i * 600);
            }
            showBubble('Zzz...', '💤');
            await new Promise(r => setTimeout(r, 2200));
            pet.className = 'pet walking';
            await movePetTo(50, 1000);
            bed.remove();
            pet.className = 'pet idle';
            resolve();
            break;
          }
          case 'bath': {
            const tub = addProp('🛁', 'prop-tub', { left: '50%', bottom: '15px' });
            pet.className = 'pet walking';
            await movePetTo(50, 800);
            // Bubbles
            for (let i = 0; i < 8; i++) {
              setTimeout(() => {
                const b = document.createElement('div');
                b.className = 'bubble';
                const size = 8 + Math.random() * 14;
                b.style.width = size + 'px';
                b.style.height = size + 'px';
                b.style.left = (35 + Math.random() * 30) + '%';
                b.style.bottom = '70px';
                $('petArea').appendChild(b);
                setTimeout(() => b.remove(), 2000);
              }, i * 150);
            }
            pet.className = 'pet happy';
            showBubble('splash!', '💧');
            await new Promise(r => setTimeout(r, 1800));
            tub.remove();
            pet.className = 'pet idle';
            resolve();
            break;
          }
          case 'pet': {
            pet.className = 'pet happy';
            showBubble('happy!', '💚');
            floatHearts(8);
            await new Promise(r => setTimeout(r, 1800));
            pet.className = 'pet idle';
            resolve();
            break;
          }
          case 'clean': {
            pet.className = 'pet walking';
            await movePetTo(25, 700);
            showBubble('all clean!', '🧹');
            await new Promise(r => setTimeout(r, 800));
            await movePetTo(50, 700);
            pet.className = 'pet idle';
            resolve();
            break;
          }
        }
      });
    }

    // ============================================================
    // ACTIONS
    // ============================================================
    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', () => doAction(btn.dataset.action, btn));
    });

    function doAction(name, btn) {
      if (!gameData) return showToast('Loading Mochi... 🌿');
      if (isAnimating) return showToast('Let Mochi finish 🌿');
      if (Date.now() - lastActionAt < 2500) return showToast('A moment between care 🌿');
      lastActionAt = Date.now();

      const action = ACTIONS[name];
      if (!action) return;

      if (action.cost) {
        for (const [s, amt] of Object.entries(action.cost)) {
          if (gameData[s] < amt) return showToast(`Mochi needs more ${s} first 💤`);
        }
      }

      isAnimating = true;
      document.querySelectorAll('.action-btn').forEach(b => b.disabled = true);

      // Poop check: if feeding and there's poop, add more poop
      let addPoop = false;
      if (name === 'feed' && (gameData.poops || 0) < 3) addPoop = true;
      if (name === 'play' && Math.random() < 0.3 && (gameData.poops || 0) < 3) addPoop = true;

      playActionAnimation(name).then(() => {
        applyActionEffects(name, addPoop);
        isAnimating = false;
        document.querySelectorAll('.action-btn').forEach(b => b.disabled = false);
      });
    }

    function applyActionEffects(name, addPoop) {
      const action = ACTIONS[name];
      const updates = {};
      updates[action.stat] = Math.min(100, gameData[action.stat] + action.amount);
      if (action.cost) {
        for (const [s, amt] of Object.entries(action.cost)) {
          updates[s] = Math.max(0, gameData[s] - amt);
        }
      }
      updates.xp = (gameData.xp || 0) + action.xp;
      updates.lastUpdate = Date.now();

      if (addPoop) {
        updates.poops = Math.min(3, (gameData.poops || 0) + 1);
      }

      if (name === 'clean') {
        updates.poops = 0;
        updates[action.stat] = Math.min(100, gameData[action.stat] + action.amount);
      }

      const today = new Date().toISOString().slice(0, 10);
      const todayActions = { ...(gameData.todayActions || { koy: 0, metz: 0 }) };
      if (gameData.todayDate !== today) {
        todayActions.koy = 0; todayActions.metz = 0;
        updates.todayDate = today;
      }
      todayActions[me] = (todayActions[me] || 0) + 1;
      updates.todayActions = todayActions;

      if (todayActions[me] === DAILY_GOAL) {
        updates.xp += 10;
        setTimeout(() => showToast('✨ Daily goal complete! +10 XP'), 500);
      }

      const entry = { by: me, text: `${action.verb} Mochi`, time: Date.now() };
      const key = 'diary/' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      updates[key] = entry;

      const diary = gameData.diary || {};
      const keys = Object.keys(diary).sort();
      if (keys.length >= MAX_DIARY) {
        keys.slice(0, keys.length - MAX_DIARY + 1).forEach(k => updates['diary/' + k] = null);
      }

      db.ref('tamagotchi').update(updates);
    }

    function showLevelUp(newLevel) {
      const stage = STAGES.reduce((acc, s) => (newLevel >= s.level ? s : acc), STAGES[0]);
      const overlay = document.createElement('div');
      overlay.className = 'levelup-overlay';
      overlay.innerHTML = `
        <div class="levelup-badge">
          ${stage.emoji}<br>
          LV ${newLevel}<br>
          ${stage.name}
        </div>
      `;
      document.body.appendChild(overlay);
      setTimeout(() => overlay.remove(), 2200);
      $('petStageBadge').classList.add('level-up');
      setTimeout(() => $('petStageBadge').classList.remove('level-up'), 1500);
    }

    function showWelcomeBack(prev, curr, lastSeenTime) {
      const hoursAway = (Date.now() - lastSeenTime) / 3600000;
      let msg = '';
      if (hoursAway > 24) msg = `Away for ${Math.floor(hoursAway / 24)}d. `;
      else if (hoursAway > 1) msg = `Away for ${Math.floor(hoursAway)}h. `;
      else msg = `Welcome back! `;

      const other = me === 'koy' ? 'metz' : 'koy';
      const otherName = other === 'koy' ? '🌿 Koy' : '🌸 Metz';
      const diary = curr.diary || {};
      const otherActs = Object.values(diary)
        .filter(e => e.by === other && e.time > lastSeenTime)
        .sort((a, b) => a.time - b.time);

      if (otherActs.length > 0) {
        msg += `${otherName} cared for Mochi ${otherActs.length} time${otherActs.length > 1 ? 's' : ''}.`;
      } else {
        msg += `Mochi was waiting for you 🌿`;
      }

      showToast(`Hi ${me === 'koy' ? 'Koy' : 'Metz'}! ${msg}`);
    }

    // ============================================================
    // LOGOUT
    // ============================================================
    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('mochi_role');
      localStorage.removeItem('mochi_pin');
      location.reload();
    });
  </script>
</body>
</html>
