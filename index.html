<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochigotchi - Virtual Pet</title>
  <style>
    /* Tamagotchi Retro Device Styling */
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #000;
    }

    /* Plastic Outer Shell */
    .tamagotchi-shell {
      background: linear-gradient(145deg, #ff7eb9, #ff529a);
      width: 320px;
      height: 400px;
      border-radius: 50% 50% 45% 45% / 55% 55% 40% 40%;
      border: 4px solid #d43b7b;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5), inset 0 4px 6px rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px 25px 20px;
      position: relative;
    }

    /* Outer Egg Frame Accent */
    .shell-brand {
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      margin-top: 5px;
    }

    /* LCD Screen Bezel */
    .screen-bezel {
      background-color: #e2e2e2;
      border: 3px solid #a8a8a8;
      border-radius: 15px;
      padding: 12px;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
    }

    /* LCD Display */
    .lcd-screen {
      background-color: #a8b898; /* Classic Dot-Matrix Green/Gray */
      width: 200px;
      height: 180px;
      border: 3px solid #788868;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.15);
    }

    /* Icon Indicator Bars */
    .icon-bar {
      display: flex;
      justify-content: space-around;
      font-size: 16px;
      height: 20px;
      line-height: 20px;
      color: #384828;
    }

    .icon-bar span {
      opacity: 0.25;
      transition: opacity 0.1s ease;
    }

    .icon-bar span.active {
      opacity: 1;
      text-shadow: 0 0 1px #222;
    }

    /* Center Playfield */
    .playfield {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .pet-avatar {
      font-size: 32px;
      font-weight: bold;
      color: #182808;
      font-family: monospace;
      letter-spacing: -1px;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
    }

    .status-text {
      font-size: 11px;
      color: #283818;
      margin-top: 8px;
      font-weight: bold;
      text-align: center;
    }

    /* Meters Overlay Screen */
    .stats-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #a8b898;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: 10px;
      font-size: 11px;
      color: #182808;
      font-weight: bold;
    }

    .stats-overlay.visible {
      display: flex;
    }

    .stat-row {
      margin: 3px 0;
      display: flex;
      justify-content: space-between;
    }

    /* Physical 3-Button Controls (A, B, C) */
    .controls {
      display: flex;
      justify-content: space-between;
      width: 180px;
      margin-bottom: 10px;
    }

    .btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(145deg, #f0f0f0, #c8c8c8);
      border: 2px solid #888;
      border-radius: 50%;
      box-shadow: 0 4px 0 #666, 0 5px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 12px;
      color: #444;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #666, 0 2px 3px rgba(0,0,0,0.3);
    }

    .btn-label {
      font-size: 10px;
      color: #fff;
      text-align: center;
      margin-top: 4px;
      font-weight: bold;
    }

    .btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="tamagotchi-shell">
    <div class="shell-brand">Mochigotchi</div>

    <!-- LCD Display Screen -->
    <div class="screen-bezel">
      <div class="lcd-screen">
        
        <!-- Top Icon Row -->
        <div class="icon-bar" id="top-icons">
          <span id="icon-feed">🍔</span>
          <span id="icon-light">💡</span>
          <span id="icon-play">⚽</span>
          <span id="icon-heal">💉</span>
        </div>

        <!-- Main Display Area -->
        <div class="playfield">
          <div class="pet-avatar" id="pet-avatar">(◕‿◕)</div>
          <div class="status-text" id="status-text">Mochi is happy</div>

          <!-- Stats Overlay Screen (Toggled via Button C) -->
          <div class="stats-overlay" id="stats-overlay">
            <div class="stat-row"><span>NAME:</span><span id="stat-name">MOCHI</span></div>
            <div class="stat-row"><span>AGE:</span><span id="stat-age">0 yr</span></div>
            <div class="stat-row"><span>HUNGER:</span><span id="stat-hunger">❤❤❤❤</span></div>
            <div class="stat-row"><span>HAPPY:</span><span id="stat-happy">❤❤❤❤</span></div>
          </div>
        </div>

        <!-- Bottom Icon Row -->
        <div class="icon-bar" id="bottom-icons">
          <span id="icon-clean">🧹</span>
          <span id="icon-stats">📊</span>
          <span id="icon-alert">🚨</span>
        </div>

      </div>
    </div>

    <!-- Physical Buttons: A (Select), B (Execute), C (Cancel/Stats) -->
    <div class="controls">
      <div class="btn-wrapper">
        <div class="btn" id="btn-a">A</div>
        <div class="btn-label">SELECT</div>
      </div>
      <div class="btn-wrapper">
        <div class="btn" id="btn-b">B</div>
        <div class="btn-label">EXEC</div>
      </div>
      <div class="btn-wrapper">
        <div class="btn" id="btn-c">C</div>
        <div class="btn-label">STATS</div>
      </div>
    </div>
  </div>

  <script>
    /**
     * Tamaweb-Style Production Mochigotchi Engine
     */
    (function () {
      'use strict';

      // Icon Selector Indexes for Button A cycle
      const MENU_ICONS = ['feed', 'light', 'play', 'heal', 'clean', 'stats'];

      const AVATARS = Object.freeze({
        HAPPY: '(◕‿◕)',
        EATING: '(´～`)',
        PLAYING: '(ﾟ▽ﾟ)',
        SAD: '(´-﹏-`)',
        SLEEPING: '(￣o￣)',
        DEAD: '(x_x)'
      });

      class Mochigotchi {
        constructor() {
          this.name = 'MOCHI';
          this.hunger = 4; // Max 4 Hearts
          this.happiness = 4; // Max 4 Hearts
          this.age = 0;
          this.isAlive = true;
          this.isSleeping = false;
          
          this.selectedMenuIndex = 0;
          this.showingStats = false;
          this.actionTimeout = null;

          this.initDOM();
          this.bindControls();
          this.startTimers();
          this.render();
        }

        initDOM() {
          this.dom = {
            avatar: document.getElementById('pet-avatar'),
            status: document.getElementById('status-text'),
            statsOverlay: document.getElementById('stats-overlay'),
            statName: document.getElementById('stat-name'),
            statAge: document.getElementById('stat-age'),
            statHunger: document.getElementById('stat-hunger'),
            statHappy: document.getElementById('stat-happy'),
            iconFeed: document.getElementById('icon-feed'),
            iconLight: document.getElementById('icon-light'),
            iconPlay: document.getElementById('icon-play'),
            iconHeal: document.getElementById('icon-heal'),
            iconClean: document.getElementById('icon-clean'),
            iconStats: document.getElementById('icon-stats'),
            iconAlert: document.getElementById('icon-alert'),
            btnA: document.getElementById('btn-a'),
            btnB: document.getElementById('btn-b'),
            btnC: document.getElementById('btn-c')
          };
        }

        bindControls() {
          // Button A: Cycle through menu icons
          this.dom.btnA.addEventListener('click', () => {
            if (!this.isAlive) return;
            if (this.showingStats) this.toggleStats(false);

            this.selectedMenuIndex = (this.selectedMenuIndex + 1) % MENU_ICONS.length;
            this.updateIconHighlight();
          });

          // Button B: Execute selected action
          this.dom.btnB.addEventListener('click', () => {
            if (!this.isAlive) {
              this.revive();
              return;
            }

            if (this.showingStats) {
              this.toggleStats(false);
              return;
            }

            const currentAction = MENU_ICONS[this.selectedMenuIndex];
            this.executeAction(currentAction);
          });

          // Button C: Toggle Stats Screen / Cancel
          this.dom.btnC.addEventListener('click', () => {
            if (!this.isAlive) return;
            this.toggleStats(!this.showingStats);
          });
        }

        executeAction(action) {
          clearTimeout(this.actionTimeout);

          switch (action) {
            case 'feed':
              if (this.isSleeping) return;
              this.hunger = Math.min(4, this.hunger + 1);
              this.dom.avatar.textContent = AVATARS.EATING;
              this.dom.status.textContent = 'Nom nom nom...';
              break;

            case 'light':
              this.isSleeping = !this.isSleeping;
              this.dom.status.textContent = this.isSleeping ? 'Lights out...' : 'Lights on!';
              break;

            case 'play':
              if (this.isSleeping) return;
              this.happiness = Math.min(4, this.happiness + 1);
              this.dom.avatar.textContent = AVATARS.PLAYING;
              this.dom.status.textContent = 'Playing game!';
              break;

            case 'heal':
              this.dom.status.textContent = 'Healthy & happy!';
              break;

            case 'clean':
              this.dom.status.textContent = 'Cleaned up!';
              break;

            case 'stats':
              this.toggleStats(true);
              return;
          }

          // Reset back to normal view after 2.5 seconds
          this.actionTimeout = setTimeout(() => {
            this.render();
          }, 2500);
        }

        toggleStats(show) {
          this.showingStats = show;
          if (show) {
            this.dom.statsOverlay.classList.add('visible');
            this.dom.statName.textContent = this.name;
            this.dom.statAge.textContent = `${this.age} yr`;
            this.dom.statHunger.textContent = '❤'.repeat(this.hunger) + '♡'.repeat(4 - this.hunger);
            this.dom.statHappy.textContent = '❤'.repeat(this.happiness) + '♡'.repeat(4 - this.happiness);
          } else {
            this.dom.statsOverlay.classList.remove('visible');
          }
        }

        updateIconHighlight() {
          // Clear all active states
          [
            this.dom.iconFeed, this.dom.iconLight, this.dom.iconPlay,
            this.dom.iconHeal, this.dom.iconClean, this.dom.iconStats
          ].forEach(icon => icon.classList.remove('active'));

          // Highlight selected
          const activeAction = MENU_ICONS[this.selectedMenuIndex];
          if (activeAction === 'feed') this.dom.iconFeed.classList.add('active');
          if (activeAction === 'light') this.dom.iconLight.classList.add('active');
          if (activeAction === 'play') this.dom.iconPlay.classList.add('active');
          if (activeAction === 'heal') this.dom.iconHeal.classList.add('active');
          if (activeAction === 'clean') this.dom.iconClean.classList.add('active');
          if (activeAction === 'stats') this.dom.iconStats.classList.add('active');
        }

        startTimers() {
          // Age increment every 60 seconds
          setInterval(() => {
            if (this.isAlive) this.age += 1;
          }, 60000);

          // Hunger/Happiness Decay every 15 seconds
          setInterval(() => {
            if (!this.isAlive || this.isSleeping) return;

            if (this.hunger > 0) this.hunger -= 1;
            if (this.happiness > 0) this.happiness -= 1;

            if (this.hunger === 0 && this.happiness === 0) {
              this.isAlive = false;
            }

            this.render();
          }, 15000);
        }

        revive() {
          this.isAlive = true;
          this.hunger = 4;
          this.happiness = 4;
          this.age = 0;
          this.isSleeping = false;
          this.render();
        }

        render() {
          this.updateIconHighlight();

          if (!this.isAlive) {
            this.dom.avatar.textContent = AVATARS.DEAD;
            this.dom.status.textContent = 'Press B to Revive';
            this.dom.iconAlert.classList.add('active');
            return;
          }

          // Alert indicator if pet needs attention
          if (this.hunger <= 1 || this.happiness <= 1) {
            this.dom.iconAlert.classList.add('active');
          } else {
            this.dom.iconAlert.classList.remove('active');
          }

          if (this.isSleeping) {
            this.dom.avatar.textContent = AVATARS.SLEEPING;
            this.dom.status.textContent = 'Zzz...';
          } else if (this.hunger <= 1 || this.happiness <= 1) {
            this.dom.avatar.textContent = AVATARS.SAD;
            this.dom.status.textContent = 'Needs care!';
          } else {
            this.dom.avatar.textContent = AVATARS.HAPPY;
            this.dom.status.textContent = `${this.name} is fine`;
          }
        }
      }

      // Launch Tamagotchi
      window.addEventListener('DOMContentLoaded', () => {
        new Mochigotchi();
      });
    })();
  </script>
</body>
</html>
